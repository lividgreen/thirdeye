name: Bug report
description: thirdeye recorded something wrong, showed nothing, or broke your agent.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        thirdeye's logs hold your prompts and every path your agent touched.
        Do not paste a log here without removing what you would not publish.
        A security problem goes to the Security tab, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.300
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and version
      description: And tmux or Zellij, if the agent runs inside one.
      placeholder: kitty 0.48.0, tmux 3.4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Ubuntu 26.04 / Windows 10 19045 / WSL 2
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `thirdeye doctor <your project>`
      description: It includes `thirdeye --version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: hook-errors.log, if anything is in it
      description: |
        `${XDG_STATE_HOME:-~/.local/state}/thirdeye/hook-errors.log`. On
        Windows, `~` is Git Bash's home directory.
      render: text
