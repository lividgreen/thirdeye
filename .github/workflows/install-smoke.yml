# Install a release the way a user does, on fresh machines, then wire,
# update and uninstall it.
#
# scripts/test-install.sh tests the scripts against a locally served
# archive; this tests a release on the platforms and architectures nobody
# here has a machine for. Each runner is a new machine, so nothing it does
# can leak into another run.
#
# Two ways in:
#   - release.yml calls it with `from-this-run`, before anything is public:
#     the archives its build made and the installers of its commit, with
#     `self update` pointed at the same files served locally. Only if this
#     passes is the release published.
#   - By hand, for a release already published, from its public URLs:
#     `gh workflow run install-smoke -f version=0.0.5` (default: the latest).
name: install-smoke

on:
  workflow_call:
    inputs:
      version:
        description: "The release, e.g. v0.0.5"
        required: true
        type: string
      from-this-run:
        description: "Install the calling run's archives, not a published release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "A published release, e.g. 0.0.5 (default: the latest)"
        required: false
        type: string

permissions:
  contents: read

env:
  REPO: lividgreen/thirdeye
  VERSION: ${{ inputs.version }}
  FROM_RUN: ${{ inputs.from-this-run && 'yes' || '' }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu x86_64, runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl, elf: "3e" }
          - { name: ubuntu aarch64, runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, elf: "b7" }
          # Containers: other distributions, and no systemd at all.
          - { name: debian, runs-on: ubuntu-latest, container: "debian:stable-slim", target: x86_64-unknown-linux-musl, elf: "3e" }
          - { name: alpine, runs-on: ubuntu-latest, container: "alpine:3", target: x86_64-unknown-linux-musl, elf: "3e" }
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: sh -eu {0}
    steps:
      - name: what a bare container lacks
        if: matrix.container
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl ca-certificates
          else apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; fi

      - name: the release to expect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$VERSION" ]; then want="${VERSION#v}"
          else
            want=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "$want" ] || { echo "::error::no release found"; exit 1; }
          echo "WANT=$want" >> "$GITHUB_ENV"
          echo "expecting $want"

      # From this run: its archive for this machine, and its commit's
      # installers, served as a release would serve them.
      - if: env.FROM_RUN
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: release
      - if: env.FROM_RUN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: the release, from this run or from its URLs
        run: |
          if [ -n "$FROM_RUN" ]; then
            cp src/install.sh src/install.ps1 release/
            echo "SCRIPTS=$PWD/release" >> "$GITHUB_ENV"
          elif [ -n "$VERSION" ]; then
            # A named release is fetched by its tag.
            echo "SCRIPTS=https://github.com/$REPO/releases/download/v$WANT" >> "$GITHUB_ENV"
          else
            echo "SCRIPTS=https://github.com/$REPO/releases/latest/download" >> "$GITHUB_ENV"
          fi

      - name: install, as the README says
        run: |
          if [ -n "$FROM_RUN" ]; then
            sh "$SCRIPTS/install.sh" --archive "$SCRIPTS/thirdeye-${{ matrix.target }}.tar.gz"
          else
            curl -fsSL "$SCRIPTS/install.sh" | THIRDEYE_VERSION="$WANT" sh
          fi
          bin="$HOME/.local/bin/thirdeye"
          [ -x "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: the binary is the release, for this machine
        run: |
          "$BIN" --version
          "$BIN" --version | grep -q "^thirdeye $WANT " \
            || { echo "::error::expected $WANT"; exit 1; }
          machine=$(od -An -tx1 -j18 -N1 "$BIN" | tr -d ' ')
          [ "$machine" = "${{ matrix.elf }}" ] \
            || { echo "::error::ELF machine $machine, expected ${{ matrix.elf }}"; exit 1; }

      - name: doctor, with nothing wired
        run: |
          "$BIN" doctor --user

      # Wiring Claude Code runs its own CLI (`claude plugin …`), so it is
      # installed for real. The containers check install, update and
      # uninstall without it.
      - name: Claude Code
        if: ${{ !matrix.container }}
        run: |
          npm install -g --silent @anthropic-ai/claude-code
          claude --version

      - name: wire a project and check it
        if: ${{ !matrix.container }}
        run: |
          mkdir -p "$HOME/project"
          "$BIN" install -a claude "$HOME/project" --no-units
          "$BIN" doctor "$HOME/project"

      # From this run, the files are served locally, as GitHub will serve
      # them; the containers have no server to hand and skip it.
      - name: self update
        if: ${{ !(env.FROM_RUN && matrix.container) }}
        run: |
          if [ -n "$FROM_RUN" ]; then
            python3 -m http.server 8765 --bind 127.0.0.1 --directory "$SCRIPTS" >/dev/null 2>&1 &
            for _ in $(seq 50); do curl -fs http://127.0.0.1:8765/install.sh >/dev/null && break; sleep 0.1; done
            THIRDEYE_BASE_URL=http://127.0.0.1:8765 "$BIN" self update
          else
            "$BIN" self update --version "$WANT"
          fi
          "$BIN" --version
          if [ -d "$HOME/project" ]; then "$BIN" doctor "$HOME/project"; fi

      - name: uninstall, project and then thirdeye
        run: |
          if [ -d "$HOME/project" ]; then "$BIN" uninstall "$HOME/project"; fi
          "$BIN" self uninstall
          [ ! -e "$BIN" ] || { echo "::error::the binary is still there"; exit 1; }
          data="${XDG_DATA_HOME:-$HOME/.local/share}/thirdeye"
          [ ! -e "$data" ] || { echo "::error::$data is still there"; ls -la "$data"; exit 1; }

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64, runs-on: windows-latest, target: x86_64-pc-windows-msvc, machine: "8664" }
          - { name: aarch64, runs-on: windows-11-arm, target: aarch64-pc-windows-msvc, machine: "aa64" }
    name: windows (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: the release to expect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $want = if ($env:VERSION) { $env:VERSION.TrimStart('v') } else {
            (Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
              "https://api.github.com/repos/$env:REPO/releases/latest").tag_name.TrimStart('v')
          }
          if (-not $want) { throw 'no release found' }
          "WANT=$want" >> $env:GITHUB_ENV
          "expecting $want"

      - if: env.FROM_RUN
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: release
      - if: env.FROM_RUN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: the release, from this run or from its URLs
        run: |
          $scripts = if ($env:FROM_RUN) {
            Copy-Item src/install.sh, src/install.ps1 release/
            (Resolve-Path release).Path
          } elseif ($env:VERSION) { "https://github.com/$env:REPO/releases/download/v$env:WANT" }
          else { "https://github.com/$env:REPO/releases/latest/download" }
          "SCRIPTS=$scripts" >> $env:GITHUB_ENV

      - name: install, as the README says
        run: |
          # From the home folder, as a user would: run anywhere else, the
          # script offers to wire that folder as a project.
          $release = $env:SCRIPTS
          Set-Location $env:USERPROFILE
          if ($env:FROM_RUN) {
            $env:THIRDEYE_ARCHIVE = Join-Path $release 'thirdeye-${{ matrix.target }}.zip'
            Get-Content -Raw (Join-Path $release 'install.ps1') | iex
          } else {
            $env:THIRDEYE_VERSION = $env:WANT
            irm "$release/install.ps1" | iex
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\thirdeye\thirdeye.exe'
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          "EXE=$exe" >> $env:GITHUB_ENV

      - name: the binary is the release, for this machine
        run: |
          $version = & $env:EXE --version
          $version
          if ($version -notmatch "^thirdeye $([regex]::Escape($env:WANT)) ") { throw "expected $env:WANT" }
          # The PE header's machine field: what the binary was built for.
          $bytes = [IO.File]::ReadAllBytes($env:EXE)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = '{0:x4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne '${{ matrix.machine }}') { throw "PE machine $machine, expected ${{ matrix.machine }}" }

      - name: the user PATH names the directory
        run: |
          $dir = Split-Path $env:EXE
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($path -split ';') -notcontains $dir) { throw "user PATH lacks $dir`: $path" }

      - name: doctor, with nothing wired
        run: |
          & $env:EXE doctor --user; if ($LASTEXITCODE) { exit 1 }

      # Wiring Claude Code runs its own CLI (`claude plugin …`), so it is
      # installed for real.
      - name: Claude Code
        run: |
          npm install -g --silent @anthropic-ai/claude-code
          claude --version; if ($LASTEXITCODE) { exit 1 }

      - name: wire a project and check it
        run: |
          $project = Join-Path $env:USERPROFILE 'project'
          New-Item -ItemType Directory -Force $project | Out-Null
          & $env:EXE install -a claude $project; if ($LASTEXITCODE) { exit 1 }
          & $env:EXE doctor $project; if ($LASTEXITCODE) { exit 1 }

      # From this run, the files are served locally, as GitHub will serve
      # them.
      - name: self update
        run: |
          if ($env:FROM_RUN) {
            $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:SCRIPTS -PassThru -WindowStyle Hidden
            foreach ($i in 1..50) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/install.ps1 | Out-Null; break } catch { Start-Sleep -Milliseconds 100 }
            }
            $env:THIRDEYE_BASE_URL = 'http://127.0.0.1:8765'
            & $env:EXE self update; $failed = $LASTEXITCODE
            Stop-Process $server -ErrorAction SilentlyContinue
            if ($failed) { exit 1 }
          } else {
            & $env:EXE self update --version $env:WANT; if ($LASTEXITCODE) { exit 1 }
          }
          & $env:EXE --version; if ($LASTEXITCODE) { exit 1 }
          & $env:EXE doctor (Join-Path $env:USERPROFILE 'project'); if ($LASTEXITCODE) { exit 1 }

      - name: uninstall, project and then thirdeye
        run: |
          & $env:EXE uninstall (Join-Path $env:USERPROFILE 'project'); if ($LASTEXITCODE) { exit 1 }
          & $env:EXE self uninstall; if ($LASTEXITCODE) { exit 1 }
          if (Test-Path $env:EXE) { throw 'the binary is still there' }
          # Known and undecided: whether self uninstall should also remove
          # the PATH entry and a thirdeye.exe.old it cannot delete while it
          # runs. Reported, not failed.
          $dir = Split-Path $env:EXE
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) {
            "::notice::the user PATH still names $dir"
          }
          Get-ChildItem $env:LOCALAPPDATA -Filter 'thirdeye*' -ErrorAction SilentlyContinue |
            ForEach-Object { "::notice::left under LOCALAPPDATA: $($_.FullName)" }
          Get-ChildItem $dir -ErrorAction SilentlyContinue |
            ForEach-Object { "::notice::left in $dir`: $($_.Name)" }
