# Build, check and publish a release.
#
# Started by hand on `main`: `gh workflow run release`. The version is the
# one Cargo.toml says, and its tag must not exist yet. Following GitHub's
# order for immutable releases, nothing is public until everything is in
# place and checked:
#
#   plan     the version, its changelog section, and that its tag is free
#   build    the four archives
#   draft    a draft release holding them, their checksums, both installers
#            and a provenance attestation; a draft creates no tag
#   smoke    install-smoke installs exactly those files, with this commit's
#            installers, on six fresh machines
#   publish  only then: publishing creates the tag, locks the release and
#            makes it Latest, which is what the installers and `self update`
#            fetch
#   verify   the public URLs serve the same bytes (after the fact; it cannot
#            unpublish)
#   announce www.livid.work is told
#
# A run that fails before `publish` leaves an unpublished draft and no tag:
# no version is used up. Fix, and run again; the draft is replaced.
#
# A pull request that touches what a release is built from runs `build`
# alone, so the matrix is known to work before a release depends on it.
#
# Asset names carry no version, so `releases/latest/download/<name>` always
# resolves: install.sh and install.ps1 pick a release by its URL, not by a
# file name they would first have to discover.
name: release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/install-smoke.yml
      - install.sh
      - install.ps1
      - Cargo.toml
      - Cargo.lock

# Read-only, but for the jobs that publish. The build runs third-party
# actions and pull requests' code; neither needs to write.
permissions:
  contents: read

# One release at a time: two runs would race for one draft.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "::error::releases are made from main, not $GITHUB_REF"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag exists already; bump the version first"; exit 1
          fi
          # The changelog's heading is where www.livid.work reads the date.
          heading=$(grep -m1 "^## $tag — " CHANGELOG.md) \
            || { echo "::error::CHANGELOG.md has no '## $tag — YYYY-MM-DD' heading"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag from $GITHUB_SHA: $heading"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, static: one archive runs on every distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `build.rs` stamps the binary with `git describe`.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Not `pip install ziglang`: the runner's system Python is externally
      # managed (PEP 668) and refuses it.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
      - name: cargo-zigbuild, for a static musl link
        if: matrix.zig
        run: cargo install --locked cargo-zigbuild --version 0.24.1
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p thirdeye --target ${{ matrix.target }}
          else
            cargo build --release --locked -p thirdeye --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          set -eu
          mkdir -p dist stage
          cp LICENSE-MIT LICENSE-APACHE README.md stage/
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/thirdeye.exe" stage/
              name="thirdeye-${{ matrix.target }}.zip"
              (cd stage && 7z a -tzip "../dist/$name" . >/dev/null)
              ;;
            *)
              cp "target/${{ matrix.target }}/release/thirdeye" stage/
              name="thirdeye-${{ matrix.target }}.tar.gz"
              tar -czf "dist/$name" -C stage .
              ;;
          esac
          (cd dist && sha256sum "$name" > "$name.sha256")
      # The binary for this runner's own architecture says what it is; the
      # other is cross-built and only packaged.
      - name: smoke
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) "target/${{ matrix.target }}/release/thirdeye.exe" --version ;;
            *) "target/${{ matrix.target }}/release/thirdeye" --version ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  draft:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A provenance attestation per archive: `gh attestation verify
      # <archive> -R lividgreen/thirdeye` proves it was built here, from
      # this commit, which a checksum served beside it cannot.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # GitHub attests in public repositories only; a private one's release
      # goes out without it rather than not at all.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: the notes, from the changelog
        run: |
          set -eu
          {
            echo "thirdeye is in early development: see the README's [Status](https://github.com/$GITHUB_REPOSITORY#status)."
            echo
            # The version's section, without its heading or the next one.
            awk -v tag="$TAG" '
              $0 ~ "^## " tag " " { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: a draft release, replacing a failed run's
        run: |
          set -eu
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          fi
          cp install.sh install.ps1 dist/
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "thirdeye $VERSION" --notes-file notes.md dist/*

  # Exactly the drafted files, as a user installs them.
  smoke:
    needs: [plan, draft]
    uses: ./.github/workflows/install-smoke.yml
    with:
      version: ${{ needs.plan.outputs.tag }}
      from-this-run: true

  publish:
    needs: [plan, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish, which creates the tag, and make it Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest

  # The public URLs, which the drafted files could not be fetched from.
  verify:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: latest serves what was built
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          for file in dist/*.tar.gz dist/*.zip; do
            name=$(basename "$file")
            curl -fsSL "$base/$name" -o "served-$name"
            cmp "$file" "served-$name" || { echo "::error::$name differs from what was built"; exit 1; }
            echo "ok  $name"
          done
          for script in install.sh install.ps1; do
            curl -fsSL "$base/$script" -o /dev/null && echo "ok  $script"
          done

  # Tell www.livid.work about the release, so thirdeye's card there takes
  # the card file, the logo and the changelog's date from this tag (its
  # PROJECT-CONVENTION.md, "Telling www.livid.work about a release"). After
  # `publish`, so the site never announces a release users are not given.
  announce:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - name: the release, as published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,name,url,publishedAt > release.json
      - name: repository_dispatch project-release to www.livid.work
        env:
          # Fine-grained, Contents read/write on lividgreen/www.livid.work
          # and nothing else.
          GH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          PROJECT: ${{ github.event.repository.name }}
        run: |
          set -eu
          # An unset or empty secret reaches the job as an empty string, and
          # gh's own error about it names no secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WWW_DISPATCH_TOKEN is empty"
            exit 1
          fi
          jq --arg project "$PROJECT" '{
            event_type: "project-release",
            client_payload: {
              project: $project, tag: .tagName, name: .name,
              url: .url, published_at: .publishedAt
            }
          }' release.json > dispatch.json
          cat dispatch.json
          gh api --method POST repos/lividgreen/www.livid.work/dispatches --input dispatch.json
